<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
  <style>
    body { font-family: sans-serif; background:#0B0F14; color:#E6EDF3; padding:20px; }
    input { padding:8px; font-size:14px; }
    button { padding:8px 14px; font-size:14px; }
    #molview { width:100%; height:350px; margin-top:14px; background:#070A0D; }
  </style>
</head>
<body>
  <h1>Atelier structure</h1>

  <input type="text" id="query" placeholder="nom ou SMILES" value="paracetamol">
  <button id="loadBtn">Charger</button>
  <p id="status">Prêt.</p>
  <div id="molview"></div>
  <h2>Bibliothèque</h2>
  <div id="library"></div>
  <h2>Comparateur SAR</h2>
<div style="display:flex; gap:20px;">
  <div id="molA" style="width:45%; height:250px; background:#070A0D;"></div>
  <div id="molB" style="width:45%; height:250px; background:#070A0D;"></div>
</div>
<p id="sarQuestion"></p>
<button id="sarReveal">Voir la réponse</button>
<p id="sarAnswer" style="display:none;"></p>


  
 
  

  <script type="module">
    import { fetchSDF, renderSDFInto } from "./viewer.js";
    import { library } from "./molecules.js";
    import { pairs } from "./sar.js";

const pair = pairs[0];
document.getElementById("sarQuestion").textContent = pair.question;
fetchSDF(pair.a).then(sdf => renderSDFInto("molA", sdf));
fetchSDF(pair.b).then(sdf => renderSDFInto("molB", sdf));
document.getElementById("sarReveal").addEventListener("click", () => {
  document.getElementById("sarAnswer").textContent = pair.answer;
  document.getElementById("sarAnswer").style.display = "block";
});


function buildLibrary() {
  const el = document.getElementById("library");
  for (const [theme, molecules] of Object.entries(library)) {
    const h3 = document.createElement("h3");
    h3.textContent = theme;
    h3.style.fontSize = "13px";
    el.appendChild(h3);
    molecules.forEach(name => {
      const btn = document.createElement("button");
      btn.textContent = name;
      btn.style.marginRight = "6px";
      btn.style.marginBottom = "6px";
      btn.addEventListener("click", () => {
        document.getElementById("query").value = name;
        load();
      });
      el.appendChild(btn);
    });
  }
}
buildLibrary();


    async function load() {
      const q = document.getElementById("query").value.trim();
      document.getElementById("status").textContent = "Chargement...";
      try {
        const sdf = await fetchSDF(q);
        renderSDFInto("molview", sdf);
        document.getElementById("status").textContent = "Chargé : " + q;
      } catch (e) {
        document.getElementById("status").textContent = "Erreur : " + e.message;
      }
    }

    document.getElementById("loadBtn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
